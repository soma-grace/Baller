<form action="/add-expense" method="post" class="form-stack">
    {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}

    <div class="form-group">
        <label for="amount">How much did you spend?</label>
        <div class="amount-input">
            <span>₦</span>
            <input type="text" id="amount" name="amount"
                   placeholder="e.g. 20,000" inputmode="decimal"
                   pattern="([0-9]+|[0-9]{1,3}(,[0-9]{3})+)(\.[0-9]{1,2})?"
                   data-money-input maxlength="15" required>
        </div>
    </div>

    <div class="form-group">
        <label for="category">Category</label>
        <select id="category" name="category" required>
            <option value="">Choose a category</option>
            <option value="food">Food</option>
            <option value="shopping">Shopping</option>
            <option value="transport">Transport</option>
            <option value="entertainment">Entertainment</option>
            <option value="bills">Bills</option>
            <option value="subscriptions">Subscriptions</option>
            <option value="health">Health</option>
            <option value="other">Other</option>
        </select>
    </div>

    <div class="form-group">
        <label>Was it a need or a want?</label>
        <div class="choice-grid">
            <label class="choice-card">
                <input type="radio" name="expense_type"
                       value="need" required>
                    <strong>A need</strong>
                    <small>Something essential</small>
            </label>

            <label class="choice-card">
                <input type="radio" name="expense_type"
                       value="want" required>
                    <strong>A want</strong>
                    <small>Something optional</small>
            </label>
        </div>
    </div>

    <div class="form-group">
        <label for="note"><span id="note-label-text">What was it for?</span> <span class="optional" id="note-optional">(Optional)</span></label>
        <input type="text" id="note" name="note"
               placeholder="e.g. Lunch at work" maxlength="200"
               data-default-placeholder="e.g. Lunch at work">
    </div>

    <div class="form-group">
        <label for="spent_at">Date of expense</label>
        <input type="date" id="spent_at" name="spent_at"
               max="{{ today }}" required>
    </div>

    <button type="submit" class="btn btn-primary btn-full">
        Save expense
    </button>

    {% if next %}<button type="button" class="cancel-link" data-close-expense>Cancel</button>{% else %}<a href="/transactions" class="cancel-link">Cancel</a>{% endif %}
</form>
